services:
  - type: web
    name: ingrechef-ai-automation
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: MONGO_URI
        sync: false
        placeholder: "Paste your MongoDB Atlas connection string here (e.g. mongodb+srv://...)"
      - key: OPENAI_API_KEY
        sync: false
        placeholder: "Paste your OpenAI API key here (starting with sk-...)"
      - key: JEV_API_KEY
        sync: false
        placeholder: "Paste your TypeSafe (Jev) API key here - used server-side for candidate matching"
      - key: GMAIL_QUERY
        value: "has:attachment is:unread"
