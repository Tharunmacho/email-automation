name: Ingestion retry safety

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ingestion-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Resume intake regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/ci_unreachable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            clients/python/pyproject.toml
      - name: Install application and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check retry limits, saved parses, contact compatibility and stable PDF identity
        run: >-
          python -m pytest -q
          tests/test_ingestion_checkpoint.py
          tests/test_candidate_contact_compat.py
          tests/test_identity_routing.py
