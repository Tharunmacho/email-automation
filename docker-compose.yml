# Local development infrastructure for the resume ingestion pipeline.
#   docker compose up -d          # start MongoDB + Redis
#   docker compose down
#
# The Python app runs on your host (so the OAuth browser flow + Tesseract work
# naturally). These containers just provide the datastores.
# The frontend is opt-in: `docker compose --profile frontend up --build frontend`.
#
# This file is for local dev only — server deployment runs Redis and the Celery
# services natively under systemd. See deploy/README.md.

services:
  mongo:
    image: mongo:7
    container_name: resume_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: resume_redis
    restart: unless-stopped
    # Loopback only: this Redis holds the job queue and the poll lock, and it
    # has no password. Nothing off this machine needs to reach it.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full backend stack. Start with:
  #   docker compose --profile app up -d --build api worker beat
  # The three services share the same code, environment, persistent files and
  # Redis broker; only their process command differs.
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: ${TASK_REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${TASK_REDIS_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${TASK_REDIS_RESULT_URL:-redis://redis:6379/1}
    ports:
      - "8000:8000"
    volumes:
      - ./secrets:/app/secrets
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume_worker
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    env_file:
      - .env
    environment:
      REDIS_URL: ${TASK_REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${TASK_REDIS_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${TASK_REDIS_RESULT_URL:-redis://redis:6379/1}
    volumes:
      - ./secrets:/app/secrets
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  beat:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume_beat
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/var/lib/resume-ingest/celerybeat-schedule
    env_file:
      - .env
    environment:
      REDIS_URL: ${TASK_REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${TASK_REDIS_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${TASK_REDIS_RESULT_URL:-redis://redis:6379/1}
    volumes:
      - celerybeat_data:/var/lib/resume-ingest
    depends_on:
      redis:
        condition: service_healthy

  # Optional web UI to browse MongoDB at http://localhost:8081
  mongo-express:
    image: mongo-express:1.0.2
    container_name: resume_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # This address is used by the browser, not from inside the container.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE-https://email-automation-emailbackend-tfykto-dc98c8-147-79-71-40.sslip.io}
    container_name: adira_master_crm_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mongo_data:
  app_data:
  celerybeat_data:
